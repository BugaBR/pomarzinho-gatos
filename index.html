<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111112" />
    <meta name="description" content="Um campo tranquilo para cultivar árvores e encontrar um gatinho escondido." />
    <title>pomar — clique no campo para cultivar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="scene">
      <header class="brand" aria-label="pomar">
        <svg class="brand-sprout" viewBox="0 0 32 48" aria-hidden="true">
          <path d="M15 8h6v7h-6zM9 15h6v6H9zM21 15h6v6h-6zM4 22h6v6H4zM12 22h6v6h-6zM22 22h6v6h-6zM11 30h6v6h-6zM21 30h6v6h-6zM15 36h6v9h-6z" fill="currentColor" />
        </svg>
        <h1>pomar</h1>
        <p class="tagline">um cantinho para cultivar</p>
      </header>

      <p class="instruction" id="instruction">CLIQUE NO CAMPO PARA CULTIVAR</p>
      <canvas class="field" id="field" aria-label="Campo de cultivo. Clique para cuidar das árvores." role="button" tabindex="0">
        Seu navegador não oferece suporte ao campo interativo.
      </canvas>

      <section class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="reveal-title" hidden>
        <button class="close" id="close-reveal" type="button" aria-label="Fechar">×</button>
        <div class="pixel-cat" aria-hidden="true">
          <svg viewBox="0 0 128 128" shape-rendering="crispEdges">
            <rect x="28" y="16" width="16" height="16" fill="#aeb0c4"/><rect x="36" y="24" width="16" height="16" fill="#d7d8df"/>
            <rect x="84" y="24" width="16" height="16" fill="#d7d8df"/><rect x="88" y="16" width="16" height="16" fill="#aeb0c4"/>
            <rect x="28" y="40" width="72" height="56" fill="#c9cad5"/>
            <rect x="20" y="48" width="16" height="40" fill="#c9cad5"/><rect x="92" y="48" width="16" height="40" fill="#c9cad5"/>
            <rect x="36" y="32" width="16" height="8" fill="#e3b6bf"/><rect x="84" y="32" width="16" height="8" fill="#e3b6bf"/>
            <rect x="40" y="56" width="8" height="8" fill="#27272b"/><rect x="80" y="56" width="8" height="8" fill="#27272b"/>
            <rect x="60" y="68" width="8" height="8" fill="#b98291"/><rect x="52" y="76" width="8" height="8" fill="#27272b"/><rect x="68" y="76" width="8" height="8" fill="#27272b"/>
            <rect x="4" y="56" width="24" height="4" fill="#b7b8c5"/><rect x="8" y="68" width="20" height="4" fill="#b7b8c5"/>
            <rect x="100" y="56" width="24" height="4" fill="#b7b8c5"/><rect x="100" y="68" width="20" height="4" fill="#b7b8c5"/>
            <rect x="36" y="92" width="56" height="16" fill="#c9cad5"/><rect x="44" y="104" width="16" height="12" fill="#aeb0c4"/><rect x="76" y="104" width="16" height="12" fill="#aeb0c4"/>
            <rect x="88" y="92" width="16" height="8" fill="#c9cad5"/><rect x="100" y="88" width="12" height="8" fill="#c9cad5"/><rect x="108" y="80" width="8" height="12" fill="#c9cad5"/>
          </svg>
        </div>
        <p class="found-label">VOCÊ ENCONTROU</p>
        <h2 id="reveal-title">um gatinho</h2>
        <p class="cat-name" id="cat-name">Mimi</p>
        <button class="keep-going" id="keep-going" type="button">continuar cultivando</button>
      </section>
      <div class="shade" id="shade" hidden></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
