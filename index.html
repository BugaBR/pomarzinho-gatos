<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111112" />
    <meta name="description" content="A tiny pixel farm. Grow trees and discover a cat hiding in the field." />
    <title>FARMCAT — click the field to farm</title>
    <link rel="stylesheet" href="style.css?v=3" />
  </head>
  <body>
    <main class="scene">
      <header class="brand" aria-label="FARMCAT">
        <svg class="brand-sprout" viewBox="0 0 32 48" aria-hidden="true">
          <path d="M15 8h6v7h-6zM9 15h6v6H9zM21 15h6v6h-6zM4 22h6v6H4zM12 22h6v6h-6zM22 22h6v6h-6zM11 30h6v6h-6zM21 30h6v6h-6zM15 36h6v9h-6z" fill="currentColor" />
        </svg>
        <h1>FARMCAT</h1>
        <p class="tagline">a tiny farm with a hidden friend</p>
      </header>

      <p class="instruction" id="instruction">CLICK THE FIELD TO FARM</p>
      <canvas class="field" id="field" aria-label="Farm field. Click to grow the trees." role="button" tabindex="0">
        Your browser does not support the interactive field.
      </canvas>
      <audio id="meow-audio" src="assets/miau-01.mp3" preload="auto"></audio>

      <section class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="reveal-title" tabindex="-1" hidden>
        <div class="popup-icon" aria-hidden="true">
          <img src="assets/cat-silhouette.png?v=2" alt="" />
        </div>
        <h2 id="reveal-title">You found it.</h2>
        <p class="popup-copy">You farmed the whole field. Meet <span class="cat-name" id="cat-name">Mimi</span>, a hidden friend in FARMCAT.</p>
        <div class="ca-row">
          <input id="token-ca" type="text" placeholder="Token CA will appear here" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Token contract address" />
          <button id="copy-ca" type="button" aria-label="Copy token contract address">Copy</button>
        </div>
        <p class="copy-status" id="copy-status" aria-live="polite"></p>
        <button class="trade-button" id="trade-button" type="button" disabled>TRADE ON PUMP.FUN</button>
        <p class="disclaimer">An experiment. It can go to zero. FARMCAT makes no promises.</p>
      </section>
      <div class="shade" id="shade" hidden></div>
    </main>
    <script src="script.js?v=3"></script>
  </body>
</html>
